[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chomp-chomp"
dynamic = ["version"]
description = "Review-gated VOD highlight discovery, captioning and rendering baseline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Chomp-Chomp contributors"}]
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2", "av>=11,<19"]
diarize = ["resemblyzer>=0.1.3,<1", "scikit-learn>=1.3,<2", "numpy>=1.24,<3"]
diarize-sherpa = ["sherpa-onnx>=1.10", "numpy>=1.24,<3"]
facecam = ["opencv-python-headless>=4.8,<5"]
director = ["jsonschema>=4.23,<5"]
dev = ["pytest>=8,<10", "numpy>=1.24,<3"]

[project.scripts]
chomp = "chomp.cli:main"

[tool.setuptools.packages.find]
include = ["chomp*"]

[tool.setuptools.dynamic]
version = {attr = "chomp.__version__"}

[tool.setuptools.package-data]
chomp = ["assets/*.onnx", "assets/*-LICENSE.txt", "director/contracts/*.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
