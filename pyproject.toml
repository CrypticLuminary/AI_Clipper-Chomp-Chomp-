[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chomp-chomp"
version = "0.2.0"
description = "Review-gated VOD highlight discovery, captioning and rendering baseline"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Chomp-Chomp contributors"}]
dependencies = []

[project.optional-dependencies]
asr = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10"]

[project.scripts]
chomp = "chomp.cli:main"

[tool.setuptools.packages.find]
include = ["chomp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
